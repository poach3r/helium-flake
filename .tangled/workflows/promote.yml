# Every two hours over the weekend: promote `next` to `main` once it's cached.
when:
  - event: schedule
    schedule:
      - cron: "0 */2 * * 6,0"
        timezone: America/New_York
      - cron: "0 0-6/2 * * 1"
        timezone: America/New_York
  - event: manual

engine: microvm
image: nixos

dependencies:
  - git
  - openssh
  - python3
  - curl

environment:
  BOT_HANDLE: "poacher-bot.tngl.sh"
  BOT_EMAIL: "henrymatonis@proton.me"

steps:
  - name: promote next
    command: scripts/ci/promote.sh

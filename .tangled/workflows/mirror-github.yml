when:
  - event: ["push"]
    branch: ["main"]

engine: microvm
image: nixos

clone:
  depth: 0

steps:
  - name: "mirror to GitHub"
    command: |
      if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
        git fetch --unshallow origin
      fi
      # Fetch every branch and tag so releases survive
      git fetch -q origin '+refs/heads/*:refs/mirror/heads/*' '+refs/tags/*:refs/tags/*'
      gh="https://x-access-token:${GITHUB_TOKEN}@github.com/poach3r/helium-flake.git"
      git push --force --prune "$gh" 'refs/mirror/heads/*:refs/heads/*'
      # A wildcard that matches nothing is an error
      if [ -n "$(git tag -l)" ]; then
        git push --force "$gh" 'refs/tags/*:refs/tags/*'
      fi
